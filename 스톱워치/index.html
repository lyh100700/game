<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9d7f2">
<title>MULTIPLY TIME</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen watch" id="screen">
    <div class="sky" aria-hidden="true">
      <span class="cloud cloud--1"></span>
      <span class="cloud cloud--2"></span>
      <span class="cloud cloud--3"></span>
    </div>

    <header class="topbar">
      <a class="topbar__back" href="../index.html" aria-label="게임 목록으로">←</a>
      <div>
        <h1 class="topbar__title">MULTIPLY TIME</h1>
        <p class="topbar__sub">소수점 끝자리 두 개를 곱해요</p>
      </div>
    </header>

    <p class="guide" id="guide">별을 눌러 시작하세요</p>

    <!-- 참고 화면처럼 마스코트를 두어 가운데가 비어 보이지 않게 합니다 -->
    <div class="buddies" aria-hidden="true">
      <span class="buddy buddy--a">🐱</span>
      <span class="buddy buddy--b">🐻</span>
    </div>

    <!-- 시간 표시 -->
    <div class="display">
      <div class="display__time" id="time">00:00.00</div>
    </div>

    <!-- 조작 버튼 -->
    <div class="pads">
      <button class="pad pad--cloud" id="reset" type="button">
        <img class="pad__art" src="../shared/art/watch-cloud.png" alt="" onerror="this.remove()">
        <svg class="pad__svg" viewBox="0 0 150 100" aria-hidden="true">
          <!-- 같은 도형을 두 번 그립니다: 뒤에는 굵은 흰 선으로 테두리를, 앞에는 색을 채워 -->
          <g class="pad__outline"><g class="cloudBody">
        <circle cx="42" cy="46" r="24"/>
        <circle cx="76" cy="36" r="30"/>
        <circle cx="110" cy="50" r="22"/>
        <rect x="18" y="52" width="114" height="30" rx="15"/>
      </g></g>
          <g class="pad__fill"><g class="cloudBody">
        <circle cx="42" cy="46" r="24"/>
        <circle cx="76" cy="36" r="30"/>
        <circle cx="110" cy="50" r="22"/>
        <rect x="18" y="52" width="114" height="30" rx="15"/>
      </g></g>
        </svg>
        <span class="pad__label">초기화</span>
      </button>

      <button class="pad pad--star" id="action" type="button">
        <img class="pad__art" src="../shared/art/watch-star.png" alt="" onerror="this.remove()">
        <img class="pad__art pad__art--stop" src="../shared/art/watch-star-stop.png"
             alt="" onerror="this.remove()">
        <svg class="pad__svg" viewBox="0 0 100 100" aria-hidden="true">
          <polygon class="star" points="50.00,3.00 62.05,33.42 94.70,35.48 69.50,56.33 77.63,88.02 50.00,70.50 22.37,88.02 30.50,56.33 5.30,35.48 37.95,33.42"/>
          <polygon class="star__gloss" points="50.00,3.00 62.05,33.42 94.70,35.48 69.50,56.33 77.63,88.02 50.00,70.50 22.37,88.02 30.50,56.33 5.30,35.48 37.95,33.42"/>
        </svg>
        <span class="pad__paw">🐾</span>
        <span class="pad__label" id="actionLabel">시작</span>
      </button>
    </div>

    <!-- 결과 — 그려 둔 결과판 위에 실제 값만 얹습니다 -->
    <section class="result">
      <div class="board">
        <img class="board__bg" src="../shared/art/watch-board.png"
             alt="게임 결과판" onerror="this.closest('.board').classList.add('is-bare')">
        <span class="board__time board__time--1" id="t1">--:--.--</span>
        <span class="board__time board__time--2" id="t2">--:--.--</span>
        <span class="board__dial board__dial--1" id="slot1"><i id="d1">?</i></span>
        <span class="board__dial board__dial--2" id="slot2"><i id="d2">?</i></span>
        <span class="board__total" id="total">?</span>
      </div>
    </section>

    <!-- 결과 팝업 -->
    <div class="popup" id="popup">
      <div class="popup__box">
        <div class="popup__emoji" id="popEmoji">🎉</div>
        <h2 class="popup__title" id="popTitle">0 점</h2>
        <p class="popup__text" id="popText"></p>
        <button class="btn" id="popAgain" type="button">한 판 더</button>
        <a class="popup__home" href="../index.html">목록으로</a>
      </div>
    </div>
  </div>

  <script src="../shared/progress.js"></script>
  <script src="../shared/art.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="game.js"></script>
</body>
</html>
