<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163a2d">
<title>LADDER PATH</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen ladder" id="screen">

    <header class="topbar">
      <a class="topbar__back" href="../index.html" aria-label="게임 목록으로">←</a>
      <div>
        <h1 class="topbar__title">LADDER PATH</h1>
        <p class="topbar__sub">누가 당첨될까요?</p>
      </div>
    </header>

    <div class="board" id="board">
      <div class="heads" id="heads"></div>
      <div class="track" id="track">
        <svg class="track__svg" id="svg" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="goals" id="goals"></div>
    </div>

    <footer class="controls">
      <div class="controls__row">
        <button class="btn btn--blue" id="openSetup" type="button">⚙️ 사다리 설정</button>
        <button class="btn btn--ghost" id="reset" type="button">↻ 초기화</button>
      </div>
      <button class="btn controls__go" id="startAll" type="button">▶ 전체 시작</button>
    </footer>

    <!-- 설정 패널 -->
    <div class="popup" id="setup">
      <div class="popup__box">
        <h2 class="popup__title">사다리 설정</h2>
        <p class="popup__text">인원수를 고르세요. 당첨은 항상 1개입니다.</p>
        <div class="stepper">
          <button class="stepper__btn" id="minus" type="button" aria-label="한 명 줄이기">−</button>
          <span class="stepper__value"><b id="numLabel">6</b>명</span>
          <button class="stepper__btn" id="plus" type="button" aria-label="한 명 늘리기">+</button>
        </div>
        <button class="btn" id="applySetup" type="button">이걸로 시작</button>
      </div>
    </div>

    <!-- 결과 팝업 -->
    <div class="popup" id="popup">
      <div class="popup__box">
        <div class="popup__emoji" id="popEmoji">🏆</div>
        <h2 class="popup__title" id="popTitle">당첨!</h2>
        <p class="popup__text" id="popText"></p>
        <button class="btn" id="popAgain" type="button">한 판 더</button>
        <a class="popup__home" href="../index.html">목록으로</a>
      </div>
    </div>

  </div>

  <script src="../shared/progress.js"></script>
  <script src="../shared/art.js"></script>
  <script src="../shared/chars.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="game.js"></script>
</body>
</html>
